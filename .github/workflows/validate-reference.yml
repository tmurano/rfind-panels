name: Validate reference submission

on:
  pull_request:
    paths:
      - "**/reference.yaml"
      - "**/up.tsv"
      - "**/down.tsv"
      - "schema.yaml"
      - "scripts/validate_reference.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Find reference directories touched by this PR
        id: find
        run: |
          set -e
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base_sha" "$head_sha")
          echo "Changed files:"
          echo "$changed"
          references=$(echo "$changed" \
            | grep -E '(reference\.yaml|up\.tsv|down\.tsv)$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | grep -v '^\.$' || true)
          {
            echo 'references<<EOF'
            echo "$references"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$references" ]; then
            echo "No reference directories changed, skipping."
          else
            echo "References to validate:"
            echo "$references"
          fi

      - name: Validate references
        id: validate
        if: steps.find.outputs.references != ''
        run: |
          set +e
          python3 scripts/validate_reference.py ${{ steps.find.outputs.references }} > validation.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat validation.md

      - name: Post PR comment
        if: steps.find.outputs.references != '' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try { body = fs.readFileSync('validation.md', 'utf8'); }
            catch (e) { body = '_(validation script did not produce output)_'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail if validation failed
        if: steps.find.outputs.references != '' && steps.validate.outputs.rc != '0'
        run: |
          echo "::error::Reference validation failed — see PR comment for details."
          exit 1
